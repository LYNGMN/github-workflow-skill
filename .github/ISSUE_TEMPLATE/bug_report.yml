name: Bug report
description: Report a reproducible problem in English
title: "[Area] Describe the observable problem"
body:
  - type: checkboxes
    id: search
    attributes:
      label: Existing-item search
      options:
        - label: I searched existing Issues before opening this report.
          required: true
  - type: textarea
    id: existing-search-results
    attributes: { label: Existing search results, description: "Record every query, repository/scope searched, and result status/count, including no matches. Attach related Issue/PR URLs when matches or near-duplicates exist." }
    validations: { required: true }
  - type: markdown
    attributes:
      value: "Use an English, searchable title: [Area] problem or requested outcome. Include product/component, symptom, and useful environment details."
  - type: markdown
    attributes:
      value: "Use one problem or requested outcome per Issue. Put independently deliverable outcomes in a separate Issue. An umbrella Issue may connect clearly named sub-issues."
  - type: textarea
    id: summary
    attributes: { label: Summary, description: "What happened and why it matters?" }
    validations: { required: true }
  - type: textarea
    id: context
    attributes: { label: Context, description: "Product area, version, environment, and relevant conditions." }
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction, description: "Numbered steps that reproduce the problem." }
    validations: { required: true }
  - type: textarea
    id: actual-result
    attributes: { label: Actual Result, description: "What happened, including safe exact error text when useful." }
    validations: { required: true }
  - type: textarea
    id: expected-result
    attributes: { label: Expected Result, description: "What should have happened instead?" }
    validations: { required: true }
  - type: textarea
    id: impact
    attributes: { label: Impact, description: "Who is affected and what cannot be completed?" }
  - type: input
    id: priority
    attributes: { label: Priority, description: "Use the confirmed repository taxonomy. Otherwise enter Needs confirmation, state observed impact, and add the taxonomy to Open Questions." }
  - type: input
    id: labels
    attributes: { label: Labels, description: "Suggested existing Labels only; this form does not create Labels." }
  - type: input
    id: assignee
    attributes: { label: Assignee, description: "Suggested responsible person, if known." }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance Criteria, description: "Observable conditions for completion." }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: "Logs, screenshots, links, or safe redacted details." }
  - type: input
    id: keywords
    attributes: { label: Search keywords, description: "3–7 useful aliases or terms; do not keyword-stuff." }
  - type: textarea
    id: questions
    attributes: { label: Open Questions, description: "Unknown facts or decisions; do not guess." }
